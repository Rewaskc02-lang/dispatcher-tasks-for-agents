<rect x="474.0" y="193" width="52" height="6" rx="3" fill="url(#acc)" opacity="0.65"/>
<rect x="478.0" y="202" width="44" height="6" rx="3" fill="url(#acc)" opacity="0.4"/>
<text x="500" y="250" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle" opacity="1">tick runs every few minutes · a task starts only when it fits · one task per agent at a time</text>
