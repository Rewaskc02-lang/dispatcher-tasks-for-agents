<text x="292.0" y="112.0" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle" opacity="1">Your agent</text>
<text x="292.0" y="132.0" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle" opacity="1">brief · size · urgency</text>
<circle cx="226.0" cy="70" r="14" fill="url(#acc)"/>
<text x="226.0" y="75" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">2</text>
