<rect x="416.0" y="70" width="168" height="92" rx="14" fill="#161b22" stroke="#2d333b" filter="url(#sh)"/>
<text x="500.0" y="112.0" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle" opacity="1">Queue</text>
<text x="500.0" y="132.0" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle" opacity="1">waits for the right moment</text>
<circle cx="434.0" cy="70" r="14" fill="url(#acc)"/>
<text x="434.0" y="75" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">3</text>
<path d="M590.0 116.0 L618.0 116.0" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round"  marker-end="url(#ara)"/>
<rect x="624.0" y="70" width="168" height="92" rx="14" fill="#161b22" stroke="#2d333b" filter="url(#sh)"/>
<text x="708.0" y="112.0" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle" opacity="1">One agent runs it</text>
<text x="708.0" y="132.0" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle" opacity="1">Claude · Codex · Gemini</text>
<circle cx="642.0" cy="70" r="14" fill="url(#acc)"/>
<text x="642.0" y="75" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1">4</text>
<path d="M798.0 116.0 L826.0 116.0" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round"  marker-end="url(#ara)"/>
<rect x="832.0" y="70" width="168" height="92" rx="14" fill="#161b22" stroke="#2d333b" filter="url(#sh)"/>
<text x="916.0" y="112.0" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle" opacity="1">You get the result</text>
