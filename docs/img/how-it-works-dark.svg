  <marker id="ara" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.0" y="70" width="168" height="92" rx="14" fill="#161b22" stroke="#2d333b" filter="url(#sh)"/>
<text x="84.0" y="112.0" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle" opacity="1">You</text>
<text x="84.0" y="132.0" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle" opacity="1">say what to do</text>
